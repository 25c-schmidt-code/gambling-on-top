<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title></title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="style.css" >
</head>
<body>
<div class="container my-4">
  <div class="row justify-content-center">
    
    <div class="col-md-8 col-lg-6"> 

      <div id="casinoCarousel" class="carousel slide" data-bs-ride="carousel">
        
        
        <div class="carousel-indicators">
          <button type="button" data-bs-target="#casinoCarousel" data-bs-slide-to="0" class="active" aria-current="true" aria-label="Poker"></button>
          <button type="button" data-bs-target="#casinoCarousel" data-bs-slide-to="1" aria-label="Roulette"></button>
          <button type="button" data-bs-target="#casinoCarousel" data-bs-slide-to="2" aria-label="Blackjack"></button>
        </div>

       
        <div class="carousel-inner">
          
          
          <div class="carousel-item active">
            <img src="poker.jpg" 
                 class="d-block w-100 custom-carousel-img" 
                 alt="Poker" 
                 title="Poker">
            <div class="carousel-caption d-none d-md-block">
              <h5>Poker</h5>
            </div>
          </div>

         
          <div class="carousel-item">
            <img src="rulett.jpg" 
                 class="d-block w-100 custom-carousel-img" 
                 alt="Roulette"
                 title="Roulette">
            <div class="carousel-caption d-none d-md-block">
              <h5>Roulette</h5>
            </div>
          </div>

          
          <div class="carousel-item">
            <img src="bj.jpg" 
                 class="d-block w-100 custom-carousel-img" 
                 alt="Blackjack" 
                 title="Blackjack">
            <div class="carousel-caption d-none d-md-block">
              <h5>Blackjack</h5>
            </div>
          </div>

        </div>

       
        <button class="carousel-control-prev" type="button" data-bs-target="#casinoCarousel" data-bs-slide="prev">
          <span class="carousel-control-prev-icon" aria-hidden="true"></span>
          <span class="visually-hidden">Previous</span>
        </button>
        <button class="carousel-control-next" type="button" data-bs-target="#casinoCarousel" data-bs-slide="next">
          <span class="carousel-control-next-icon" aria-hidden="true"></span>
          <span class="visually-hidden">Next</span>
        </button>

      </div>

    </div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js" integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.min.js" integrity="sha384-G/EV+4j2dNv+tEPo3++6LCgdCROaejBqfUeNjuKAiuXbjrxilcCdDz6ZAVfHWe1Y" crossorigin="anonymous"></script>
</body>
</html>
